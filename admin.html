<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FastPesa Admin Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7f9;
}


/* Header */

header{

background:#0a8f5a;
color:white;
padding:20px 35px;
display:flex;
justify-content:space-between;
align-items:center;

}

.logo{

font-size:28px;
font-weight:bold;

}

.logout{

background:white;
color:#0a8f5a;
padding:10px 20px;
border-radius:20px;
text-decoration:none;
font-weight:bold;

}


/* Container */

.container{

padding:30px;
max-width:1300px;
margin:auto;

}


/* Stats */

.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:20px;
margin-bottom:30px;

}


.card{

background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);

}


.card h3{

color:#0a8f5a;
margin-bottom:15px;

}


.number{

font-size:32px;
font-weight:bold;

}



/* Table */

.table-box{

background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
overflow-x:auto;

}


table{

width:100%;
border-collapse:collapse;

}


th{

background:#0a8f5a;
color:white;
padding:15px;
text-align:left;

}


td{

padding:15px;
border-bottom:1px solid #ddd;

}


/* Buttons */

.approve{

background:#0a8f5a;
color:white;
border:none;
padding:8px 15px;
border-radius:5px;
cursor:pointer;

}


.reject{

background:#d32f2f;
color:white;
border:none;
padding:8px 15px;
border-radius:5px;
cursor:pointer;

}


footer{

text-align:center;
padding:25px;
color:#777;

}

</style>

</head>


<body>


<header>

<div class="logo">
FastPesa Admin
</div>


<a href="login.html" class="logout">
Logout
</a>


</header>



<div class="container">



<div class="cards">


<div class="card">

<h3>
Total Users
</h3>

<p class="number">
1,245
</p>

</div>



<div class="card">

<h3>
Pending Applications
</h3>

<p class="number">
35
</p>

</div>



<div class="card">

<h3>
Approved Loans
</h3>

<p class="number">
560
</p>

</div>



<div class="card">

<h3>
Total Disbursed
</h3>

<p class="number">
KES 850,000
</p>

</div>


</div>




<div class="table-box">


<h2>
Loan Applications
</h2>


<br>


<table>


<tr>

<th>
Applicant
</th>

<th>
Phone
</th>

<th>
Amount
</th>

<th>
Status
</th>

<th>
Action
</th>

</tr>



<tr>

<td>
John Doe
</td>

<td>
0712******

</td>

<td>
KES 5,000

</td>

<td>
Pending

</td>

<td>

<button class="approve">
Approve
</button>


<button class="reject">
Reject
</button>

</td>


</tr>



<tr>

<td>
Mary Wanjiku
</td>

<td>
0700******

</td>

<td>
KES 10,000

</td>

<td>
Pending

</td>

<td>

<button class="approve">
Approve
</button>


<button class="reject">
Reject
</button>


</td>

</tr>


</table>


</div>



</div>



<footer>

© 2026 FastPesa Loan App Admin Panel

</footer>



</body>

</html>
