<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FastPesa - Apply For Loan</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
<script>

document.querySelector("form").addEventListener("submit", async function(e){

e.preventDefault();

const amount = document.querySelector('input[type="number"]').value;

const period = document.querySelector("select").value;

const purpose = document.querySelectorAll("input")[1].value;

const employment = document.querySelectorAll("input")[2].value;

const response = await fetch("https://fastpesa-loans.onrender.com/apply-loan",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
amount,
period,
purpose,
employment
})

});

const data = await response.json();

alert(data.message);

window.location="dashboard.html";

});

</script>
body{
background:#f4f7f9;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}


.container{

width:95%;
max-width:550px;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.1);

}


.logo{

text-align:center;
font-size:30px;
font-weight:bold;
color:#0a8f5a;
margin-bottom:10px;

}


.title{

text-align:center;
color:#555;
margin-bottom:25px;

}


input, select{

width:100%;
padding:15px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;

}


.loan-box{

background:#e8f5e9;
padding:15px;
border-radius:10px;
margin-bottom:20px;

}


.loan-box p{

margin:5px 0;

}


button{

width:100%;
padding:16px;
background:#0a8f5a;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;

}


button:hover{

background:#08754a;

}


.back{

text-align:center;
margin-top:20px;

}


.back a{

color:#0a8f5a;
text-decoration:none;
font-weight:bold;

}


.note{

font-size:13px;
color:#777;
text-align:center;
margin-top:20px;

}

</style>

</head>


<body>


<div class="container">


<div class="logo">
FastPesa
</div>


<p class="title">
Loan Application Form
</p>



<div class="loan-box">

<p><b>Maximum Loan Limit:</b> KES 10,000</p>

<p><b>Processing:</b> Subject to approval</p>

<p><b>Disbursement:</b> M-Pesa</p>

</div>



<form>


<input 
type="number"
placeholder="Amount Requested (KES)"
required>



<select required>

<option>Select Repayment Period</option>

<option>7 Days</option>

<option>14 Days</option>

<option>30 Days</option>

<option>60 Days</option>

</select>



<input
type="text"
placeholder="Purpose of Loan"
required>



<input
type="text"
placeholder="Employment / Business Details"
required>



<button type="submit">

Submit Loan Application

</button>


</form>



<div class="back">

<a href="dashboard.html">
← Back To Dashboard
</a>

</div>


<p class="note">

By submitting this application, you agree to the loan terms and conditions.

</p>



</div>


</body>

</html>
