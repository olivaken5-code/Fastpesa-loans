<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FastPesa - Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#f4f7f9;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;

}


.login-box{

width:95%;
max-width:420px;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);

}


.logo{

text-align:center;
font-size:32px;
font-weight:bold;
color:#0a8f5a;
margin-bottom:10px;

}


.title{

text-align:center;
color:#555;
margin-bottom:30px;

}


input{

width:100%;
padding:15px;
margin-bottom:18px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;

}


button{

width:100%;
padding:15px;
background:#0a8f5a;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;

}


button:hover{

background:#08754a;

}


.forgot{

text-align:right;
margin-bottom:20px;

}


.forgot a{

color:#0a8f5a;
text-decoration:none;

}


.register{

text-align:center;
margin-top:25px;

}


.register a{

color:#0a8f5a;
font-weight:bold;
text-decoration:none;

}


.security{

margin-top:20px;
text-align:center;
font-size:13px;
color:#777;

}


</style>

</head>


<body>


<div class="login-box">


<div class="logo">
FastPesa
</div>


<p class="title">
Login to your account
</p>


<form>


<input 
type="tel" 
placeholder="M-Pesa Phone Number"
required>


<input 
type="password" 
placeholder="Password"
required>


<div class="forgot">
<a href="#">Forgot Password?</a>
</div>


<button type="submit">
Login
</button>


</form>


<div class="register">

Don't have an account?
<a href="register.html">
Create Account
</a>

</div>


<div class="security">

🔒 Your information is protected with secure technology.

</div>


</div>


</body>
  <script>

document.querySelector("form").addEventListener("submit", async function(e){

e.preventDefault();

const phone = document.querySelector('input[type="tel"]').value;

const password = document.querySelector('input[type="password"]').value;

const response = await fetch("https://fastpesa-loans.onrender.com/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
phone:phone,
password:password
})

});

const data = await response.json();

alert(data.message);

window.location="dashboard.html";

});

  </script>

</html>
