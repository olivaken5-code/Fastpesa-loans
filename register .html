<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FastPesa - Create Account</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#f4f7f9;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{

width:95%;
max-width:450px;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);

}

.logo{
text-align:center;
font-size:30px;
font-weight:bold;
color:#0a8f5a;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:25px;
}

input, select{

width:100%;
padding:15px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;

}

button{

width:100%;
padding:15px;
background:#0a8f5a;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;

}

button:hover{

background:#08754a;

}

.login{

text-align:center;
margin-top:20px;

}

.login a{

color:#0a8f5a;
text-decoration:none;
font-weight:bold;

}

.note{

font-size:13px;
color:#777;
margin-top:15px;
text-align:center;

}

</style>

</head>


<body>


<div class="container">


<div class="logo">
FastPesa
</div>


<p class="subtitle">
Create your loan account
</p>


<form>


<input type="text" placeholder="Full Name" required>


<input type="tel" placeholder="M-Pesa Phone Number" required>


<input type="number" placeholder="National ID Number" required>


<input type="email" placeholder="Email Address" required>


<input type="password" placeholder="Create Password" required>


<input type="password" placeholder="Confirm Password" required>


<select required>

<option>Select County</option>
<option>Nairobi</option>
<option>Kisumu</option>
<option>Mombasa</option>
<option>Nakuru</option>
<option>Kisii</option>

</select>


<button type="submit">
Create Account
</button>


</form>


<div class="login">

Already have an account?
<a href="login.html">Login</a>

</div>


<p class="note">
By creating an account, you agree to our terms and privacy policy.
</p>


</div>


</body>

</html>
